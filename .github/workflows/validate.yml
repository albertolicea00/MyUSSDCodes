name: Validate catalog

on:
  push:
    branches: [main]
    paths:
      - "data/codes/**"
      - "data/schema/**"
      - "data/scripts/validate.js"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/codes/**"
      - "data/schema/**"
      - "data/scripts/validate.js"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate catalog
        run: node data/scripts/validate.js
